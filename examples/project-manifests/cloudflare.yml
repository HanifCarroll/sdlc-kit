version: 1
project: example-worker
base_branch: main

tracker:
  provider: github

docs:
  constitution: docs/constitution.md
  current_state: docs/current-state.md
  capabilities_dir: docs/capabilities
  plans_dir: docs/plans
  decisions_dir: docs/adr

worktrees:
  root: ../example-worker-worktrees
  branch_prefix: codex

local:
  provider: none
  required_before_push: false

preview:
  provider: cloudflare
  required_before_merge: true
  environment: preview
  require_preview_secrets: true

production:
  required_before_issue_close: true
  smoke_paths:
    - /

drift:
  mode: warn
  mappings:
    - source_paths:
        - src/**
        - wrangler.toml
      docs:
        - docs/capabilities/worker.md

commands:
  install: bun install
  check: bun run check
  test: bun test
